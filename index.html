<p>このアプリは、所有者本人が自分のPCのファイルを自分の Google ドライブにバックアップするためだけに使う個人用ツールです。</p>

<ul>
<li>このアプリは Google ドライブ上で、アプリ自身が作成したファイルにのみアクセスします（drive.file）。</li>
<li>取得したデータを第三者に提供・販売することはありません。</li>
<li>データは所有者本人の Google ドライブにのみ保存されます。</li>
